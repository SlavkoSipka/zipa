<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 30" role="img">
  <title>Srpska trobojka i zastava Bosne i Hercegovine</title>

  <!--
    Podela je kosa, od gornje leve ka donjoj desnoj strani.

    Nagib je BLAZI od kose ivice zutog trougla na zastavi BiH i namerno:
    na zatecenoj slicici su te dve kosine isle skoro uporedo (mereno na
    `basr.png`: rez 14→44, zuta ivica 28→48), pa se BiH videla samo kao
    tanka traka i dve linije su se stapale. Ovako rez pada strmije, BiH
    dobija pun klin, a izmedju reza i zutog uvek stoji plavo polje.

    Svaka zastava se crta preko CELOG polja pa se isecanjem zadrzi njena
    strana — trobojka time ima pun odnos traka, umesto da bude stisnuta.
  -->
  <clipPath id="jezik-ba-levo">
    <polygon points="0,0 18.0,0 32.0,30 0,30"/>
  </clipPath>
  <clipPath id="jezik-ba-desno">
    <polygon points="18.0,0 50,0 50,30 32.0,30"/>
  </clipPath>

  <!-- Leva strana: srpska trobojka, bez grba. -->
  <g clip-path="url(#jezik-ba-levo)">
    <rect x="0" y="0"  width="50" height="10" fill="#C6363C"/>
    <rect x="0" y="10" width="50" height="10" fill="#0C4076"/>
    <rect x="0" y="20" width="50" height="10" fill="#FFFFFF"/>
  </g>

  <!-- Desna strana: zastava Bosne i Hercegovine. -->
  <g clip-path="url(#jezik-ba-desno)">
    <rect x="0" y="0" width="50" height="30" fill="#002395"/>
    <polygon points="28.0,0 50,0 50,30" fill="#FECB00"/>
    <g fill="#FFFFFF">
      <polygon points="28.26,3.07 28.57,4.00 29.55,4.00 28.76,4.58 29.06,5.51 28.26,4.93 27.47,5.51 27.77,4.58 26.98,4.00 27.96,4.00"/>
      <polygon points="30.46,6.07 30.77,7.00 31.75,7.00 30.96,7.58 31.26,8.51 30.46,7.93 29.67,8.51 29.97,7.58 29.18,7.00 30.16,7.00"/>
      <polygon points="32.66,9.07 32.97,10.00 33.95,10.00 33.16,10.58 33.46,11.51 32.66,10.93 31.87,11.51 32.17,10.58 31.38,10.00 32.36,10.00"/>
      <polygon points="34.86,12.07 35.17,13.00 36.15,13.00 35.36,13.58 35.66,14.51 34.86,13.93 34.07,14.51 34.37,13.58 33.58,13.00 34.56,13.00"/>
      <polygon points="37.06,15.07 37.37,16.00 38.35,16.00 37.56,16.58 37.86,17.51 37.06,16.93 36.27,17.51 36.57,16.58 35.78,16.00 36.76,16.00"/>
      <polygon points="39.26,18.07 39.57,19.00 40.55,19.00 39.76,19.58 40.06,20.51 39.26,19.93 38.47,20.51 38.77,19.58 37.98,19.00 38.96,19.00"/>
      <polygon points="41.46,21.07 41.77,22.00 42.75,22.00 41.96,22.58 42.26,23.51 41.46,22.93 40.67,23.51 40.97,22.58 40.18,22.00 41.16,22.00"/>
      <polygon points="43.66,24.07 43.97,25.00 44.95,25.00 44.16,25.58 44.46,26.51 43.66,25.93 42.87,26.51 43.17,25.58 42.38,25.00 43.36,25.00"/>
      <polygon points="45.86,27.07 46.17,28.00 47.15,28.00 46.36,28.58 46.66,29.51 45.86,28.93 45.07,29.51 45.37,28.58 44.58,28.00 45.56,28.00"/>
    </g>
  </g>
</svg>
